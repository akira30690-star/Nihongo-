<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruby HTML 生成器</title>

<style>
body{
    font-family:sans-serif;
    max-width:900px;
    margin:20px auto;
    padding:20px;
}

textarea{
    width:100%;
    height:220px;
    font-size:18px;
    line-height:1.6;
    box-sizing:border-box;
}

button{
    margin:10px 10px 10px 0;
    padding:8px 18px;
    font-size:16px;
}

#preview{
    margin-top:20px;
    border:1px solid #ccc;
    padding:20px;
    font-size:36px;
    line-height:2;
}

rt{
    font-size:0.45em;
}
</style>

</head>
<body>

<h2>Ruby HTML 生成器</h2>

<p>输入格式：</p>

<pre>
今日は 今日|きょう 学校|がっこう へ 行|い きます。
夜|よる は 短|みじか し、歩|ある けよ 乙女|おとめ。
</pre>

<textarea id="input"></textarea>

<br>

<button onclick="generate()">生成</button>
<button onclick="copyHTML()">复制HTML</button>

<h3>HTML</h3>

<textarea id="output" readonly></textarea>

<h3>预览</h3>

<div id="preview"></div>

<script>

function generate() {

    let text = document.getElementById("input").value;

    // 把 汉字|假名 转成 ruby
    text = text.replace(
        /([^\s|]+)\|([^\s]+)/g,
        '<ruby>$1<rt>$2</rt></ruby>'
    );

    // 只删除 </ruby> 后面的一个空格
    text = text.replace(/<\/ruby> /g, "</ruby>");

    document.getElementById("output").value = text;

    document.getElementById("preview").innerHTML =
        text.replace(/\n/g, "<br>");
}

function copyHTML(){

    navigator.clipboard.writeText(
        document.getElementById("output").value
    );

    alert("已复制 HTML");

}

document.getElementById("input").addEventListener("input",generate);

</script>

</body>
</html>
