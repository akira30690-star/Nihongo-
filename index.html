<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruby HTML 生成器</title>

<style>
body{
    max-width:1000px;
    margin:20px auto;
    padding:20px;
    font-family:sans-serif;
}

h2{
    margin-top:0;
}

textarea{
    width:100%;
    min-height:220px;
    font-size:18px;
    line-height:1.6;
    box-sizing:border-box;
    padding:10px;
}

button{
    margin:12px 8px 12px 0;
    padding:10px 20px;
    font-size:17px;
    cursor:pointer;
}

#preview{
    margin-top:20px;
    border:1px solid #ccc;
    padding:20px;
    font-size:34px;
    line-height:2;
    word-break:break-word;
}

ruby{
    ruby-align:center;
}

rt{
    font-size:0.45em;
}
</style>

</head>

<body>

<h2>Ruby HTML 生成器</h2>

<p><b>输入格式：</b>汉字|假名</p>

<p>例如：</p>

<pre>
今日は 今日|きょう 学校|がっこう へ 行|い きます。
夜|よる は 短|みじか し、歩|ある けよ 乙女|おとめ。
</pre>

<textarea id="input" placeholder="请输入文本……"></textarea>

<br>

<button onclick="generate()">生成HTML</button>
<button onclick="copyHTML()">复制HTML</button>
<button onclick="clearAll()">清空</button>

<h3>HTML</h3>

<textarea id="output" readonly></textarea>

<h3>预览</h3>

<div id="preview"></div>

<script>

function generate(){

    const input=document.getElementById("input").value;

    const html=input.replace(
        /([^\s|]+)\|([^\s]+)/g,
        '<ruby>$1<rt>$2</rt></ruby>'
    );

    document.getElementById("output").value=html;

    document.getElementById("preview").innerHTML=html.replace(/\n/g,"<br>");

}

function copyHTML(){

    const text=document.getElementById("output").value;

    navigator.clipboard.writeText(text).then(()=>{
        alert("HTML 已复制！");
    });

}

function clearAll(){

    document.getElementById("input").value="";
    document.getElementById("output").value="";
    document.getElementById("preview").innerHTML="";

}

document.getElementById("input").addEventListener("input",generate);

</script>

</body>
</html>
